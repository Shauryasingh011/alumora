<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    /* Saber Effect Animation */
    @keyframes saber-glow {
      0% { box-shadow: 0 0 5px #00ffea, 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 40px #00ffea; }
      50% { box-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 40px #00ffea, 0 0 80px #00ffea; }
      100% { box-shadow: 0 0 5px #00ffea, 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 40px #00ffea; }
    }

    .saber-effect {
      animation: saber-glow 1.5s infinite;
      border: 2px solid #00ffea;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-white text-black font-sans">
  <div class="max-w-2xl mx-auto p-4 md:p-8">
    <!-- Header Section -->
    <div class="flex items-center justify-between mb-6 md:mb-8">
      <i class="fas fa-arrow-left text-xl md:text-2xl"></i>
      <h1 class="text-xl md:text-2xl font-semibold">My Profile</h1>
      <i class="fas fa-cog text-xl md:text-2xl"></i>
    </div>

    <!-- Profile Section -->
    <div class="flex flex-col items-center mb-6 md:mb-8 saber-effect p-6">
      <div class="rounded-full w-24 h-24 md:w-32 md:h-32 mb-4 flex items-center justify-center bg-gray-200">
        <i class="fas fa-user text-4xl md:text-5xl text-gray-500"></i>
      </div>
      <h2 class="text-lg md:text-xl font-semibold">Name: Shivansh</h2>
      <p class="text-gray-500 text-sm md:text-base">shivansh@example.com</p>
      <button class="mt-4 px-4 py-2 md:px-6 md:py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition duration-300">
        Edit Profile
      </button>
    </div>

    <!-- Menu Section -->
    <div class="space-y-4 md:space-y-6">
      <div class="flex items-center justify-between saber-effect p-4">
        <div class="flex items-center space-x-4">
          <i class="fas fa-comments text-xl md:text-2xl"></i>
          <span class="text-base md:text-lg">Chat History</span>
        </div>
        <i class="fas fa-chevron-right text-base md:text-lg"></i>
      </div>
      <div class="flex items-center justify-between saber-effect p-4">
        <div class="flex items-center space-x-4">
          <i class="fas fa-video text-xl md:text-2xl"></i>
          <span class="text-base md:text-lg">Courses Watched</span>
        </div>
        <i class="fas fa-chevron-right text-base md:text-lg"></i>
      </div>
      <div class="flex items-center justify-between saber-effect p-4">
        <div class="flex items-center space-x-4">
          <i class="fas fa-heart text-xl md:text-2xl"></i
