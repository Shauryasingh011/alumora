<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Log in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            overflow: hidden;
        }

        .fade-in {
            opacity: 1;
        }

        .fade-out {
            opacity: 0;
        }

        .hidden {
            display: none;
        }

        .slide-in-left {
            animation: slideInLeft 1s ease-in-out both;
            filter: blur(2px);
            animation-fill-mode: forwards;
        }

        .slide-in-right {
            animation: slideInRight 1s ease-in-out both;
            filter: blur(2px);
            animation-fill-mode: forwards;
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-100%);
                opacity: 0;
                filter: blur(8px);
            }
            100% {
                transform: translateX(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes slideInRight {
            0% {
                transform: translateX(100%);
                opacity: 0;
                filter: blur(8px);
            }
            100% {
                transform: translateX(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        .hue-shift {
            animation: hueShift 5s infinite linear;
        }

        @keyframes hueShift {
            0% {
                filter: hue-rotate(0deg);
            }
            100% {
                filter: hue-rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen fade-in" onload="fadeIn()">
    <div class="bg-white shadow-lg rounded-lg flex flex-col md:flex-row w-full max-w-4xl">
        <div class="flex-1 flex items-center justify-center p-8 slide-in-left">
            <img alt="Illustration of a person with a laptop" class="w-full max-w-sm" height="400" src="https://storage.googleapis.com/a1aa/image/8h_PMzf2xpnRuvDybGdnwlltm6Sj6uSl4qNR2dhrrvs.jpg" width="400"/>
        </div>
        <div class="flex-1 p-8 slide-in-right">
            <h1 class="text-3xl font-bold text-gray-900">
                SIGN IN TO YOUR
                <span class="text-purple-600 hue-shift">ALUMORA!</span>
            </h1>
            <h2 class="text-2xl font-bold text-gray-900 mt-4">SIGN IN</h2>
            <form class="mt-6 space-y-4" id="login-form" onsubmit="handleFormSubmit(event)">
                <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Enter name" type="text" id="name" required pattern="[a-zA-Z\s]+" title="Please enter only alphabets"/>
                <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Enter university name" type="text" id="university" required pattern="[a-zA-Z\s]+" title="Please enter only alphabets"/>
                <select class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" id="role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="student">Student</option>
                    <option value="mentor">Mentor</option>
                </select>
                <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Enter mobile number" type="text" id="mobile" required pattern="\d{10}" title="Please enter a valid 10-digit mobile number"/>
                <button class="w-full p-3 bg-gradient-to-r from-purple-600 to-blue-500 text-white font-bold rounded-lg" type="submit">Sign up</button>
                Already have an account?
                <button class="w-full p-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold rounded-lg" type="button" onclick="redirectToPage()">Login</button>
            </form>
            <p class="text-gray-500 text-sm mt-4">
                By registering you agree to our
                <a class="text-purple-600" href="#">Terms and Conditions</a>
            </p>
        </div>
    </div>
    <script>
        function handleFormSubmit(event) {
            event.preventDefault();
            const role = document.getElementById('role').value;
            const targetPage = role === 'mentor' ? 'mentorpage.html' : 'home.html';
            redirectToPage(targetPage);
        }

        function redirectToPage(page = 'home.html') {
            document.body.classList.add('fade-out');
            setTimeout(function() {
                window.location.href = page;
            }, 500);
        }

        function fadeIn() {
            document.body.style.opacity = 1;
        }

        function fadeOut(event) {
            event.preventDefault();
            document.body.style.opacity = 0;
            setTimeout(function() {
                window.location.href = event.currentTarget.href;
            }, 500);
        }

        window.onload = fadeIn;
    </script>
</body>
</html>
